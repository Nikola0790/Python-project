<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Room - {{ room.name }}</title>
    <style>
        /* Base Page Setup */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Centralized Card Wrapper */
        .booking-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            margin: 20px;
        }

        /* Header Styling */
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 24px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 12px;
        }

        .room-info {
            font-size: 14px;
            color: #666666;
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #444444;
        }

        input[type="date"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="date"]:focus,
        textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15);
        }

        textarea {
            resize: vertical;
        }

        /* Action Buttons Layout */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.15s ease-in-out;
        }

        .btn-submit {
            background-color: #007bff;
            color: #ffffff;
            border: none;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .btn-cancel {
            background-color: #eaedd0;
            color: #495057;
            border: 1px solid #ced4da;
            background-color: #f8f9fa;
        }

        .btn-cancel:hover {
            background-color: #e2e6ea;
        }

        /* Django Messaging Alerts */
        .messages {
            margin-bottom: 20px;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

    <div class="booking-card">
        <h2>Book Room</h2>
        
        <div class="room-info">
            <strong>Target Room:</strong> {{ room.name }} <br>
            <strong>Max Capacity:</strong> {{ room.capacity }} seats
        </div>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="date">Select Target Date:</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="comment">Reservation Comments:</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Add optional details regarding event structure, catering arrangements, etc."></textarea>
            </div>

            <div class="form-actions">
                <a href="{% url 'home' %}" class="btn btn-cancel">Cancel</a>
                <button type="submit" class="btn btn-submit">Confirm Booking</button>
            </div>
        </form>
    </div>

</body>
</html>
